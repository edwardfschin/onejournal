[build-system]
requires = ["setuptools>=69,<84", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "onejournal"
version = "0.1.0"
description = "Broker-independent trading journal and dashboard platform"
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb>=1.5.3,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.3,<7",
  "pytz>=2026.5,<2027", # DuckDB Python TIMESTAMPTZ read-back dependency.
  "streamlit>=1.58,<2",
  "uvicorn>=0.35,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/onejournal/migrations" = ["scripts/journal/migrations/*.sql"]

[tool.setuptools.package-data]
onejournal = ["hosted_schema.sql"]

[project.scripts]
onejournal-mac-site = "onejournal.mac_static_site:main"
onejournal-hosted-site = "onejournal.hosted_site:main"
onejournal-refresh-offline = "onejournal.refresh_intake:main"
onejournal-refresh-activity = "onejournal.refresh_activity:main"
onejournal-activity-financial-preview = "onejournal.activity_financial_preview:main"
onejournal-activity-release-preparation = "onejournal.activity_report_preparation:main"
onejournal-activity-report-backup = "onejournal.activity_report_backup:main"
onejournal-activity-publication-preparation = "onejournal.activity_publication_preparation:main"

[project.optional-dependencies]
security = ["webauthn>=3.0.1,<4"]
hosted = ["webauthn>=3.0.1,<4", "psycopg[binary]>=3.3.6,<4"]
