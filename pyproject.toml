[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onejournal"
version = "0.1.0"
description = "Broker-independent trading journal and dashboard platform"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.1",
  "streamlit>=1.35",
]

[tool.setuptools.packages.find]
where = ["src"]
