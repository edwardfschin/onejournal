[build-system]
requires = ["setuptools>=69,<83", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "onejournal"
version = "0.1.0"
description = "Broker-independent trading journal and dashboard platform"
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb>=1.5.3,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.3,<7",
  "streamlit>=1.58,<2",
  "uvicorn>=0.35,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
