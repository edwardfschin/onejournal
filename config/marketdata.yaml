marketdata:
  contract_version: 1
  mode: read_only
  provider_selection: account_broker
  provider_sequence:
    - schwab
    - ibkr
    - moomoo
  allow_cross_provider_fallback: false
  providers:
    schwab:
      enabled: false
      phase: active_first
    ibkr:
      enabled: false
      phase: planned
    moomoo:
      enabled: false
      phase: future
  pnl02_t15_staging:
    contract_version: onejournal.macos-provider-staging.v1
    target: local_macos
    enabled: false
    credential_installation_enabled: false
    provider_calls_enabled: false
    token_refresh_enabled: false
    public_listener_enabled: false
    journal_database_mounted: false
    credential_backend: macos_keychain
    private_capture_storage: external_private_vault
  storage:
    raw_root_pattern: data/raw/{provider}
    normalized_store: data/journal/onejournal.duckdb
    local_only: true
    credentials_separate: true
    redistribution_allowed: false
    retention_policy: onejournal-local-raw-market-data-lifecycle.v1
  terms_acknowledgement:
    required_before_connection_activation: true
    required_before_quote_retrieval: true
    fail_closed_when_missing_or_outdated: true
    acceptance_scope: owner_operated_local_connection
    onejournal_grants_market_data_rights: false
    runtime_entitlement_verification_required: true
    enforcement_status: local_owner_boundary_enforced_production_identity_deferred
  provider_usage:
    contract_version: onejournal.provider-usage-policy.v1
    active_profiles:
      schwab:
        profile_id: schwab-local-owner-market-data-2026-08-28.v1
        notice_version: onejournal-schwab-local-owner-notice.v1
        operating_scope: owner_operated_local_connection
        permitted_use: personal_noncommercial
        reviewed_at_utc: "2026-08-28T00:00:00Z"
        official_terms:
          - reference_id: schwab-online-services-agreement
            title: Schwab Online Services Agreement
            url: https://www.schwab.com/legal/terms
          - reference_id: schwab-market-data-online-addendum
            title: Online Addendum to Electronic Services Agreement
            url: https://www.schwab.com/legal/electronic-services-agreement-online
          - reference_id: schwab-trader-api-market-data-production
            title: Trader API Market Data Production specification and authenticated terms
            url: https://developer.schwab.com/products/trader-api--individual/details/specifications/Market%20Data%20Production
        requires_authenticated_provider_terms_confirmation: true
        provider_reported_entitlement_required: true
        redistribution_allowed: false
        public_display_allowed: false
        hosted_storage_allowed: false
        required_declarations:
          - authorized_connection
          - applicable_terms_accepted
          - authenticated_provider_terms_reviewed
          - required_entitlements_maintained
          - personal_noncommercial_use_only
          - no_redistribution_or_public_exposure
          - onejournal_does_not_grant_market_data_rights
          - raw_evidence_lifecycle_accepted
        raw_evidence_lifecycle:
          policy_id: onejournal-local-raw-market-data-lifecycle.v1
          mode: retain_until_explicit_approved_deletion_or_provider_requirement
          automatic_deletion_enabled: false
          fixed_retention_period_days: null
          deletion_requires_explicit_approval: true
          deletion_audit_required: true
          provider_rule_change_requires_new_profile: true
  polling:
    background_enabled: false
    poll_only_when_authenticated_and_active: true
    regular_session_stock_seconds: 15
    regular_session_option_seconds: 30
    extended_session_seconds: 60
    inactive_pause_seconds: 300
    closed_session_polling: false
  freshness:
    regular_session_seconds: 60
    extended_session_seconds: 120
    future_tolerance_seconds: 5
    delayed_quotes_are_current: false
    unknown_entitlement_is_valid: false
